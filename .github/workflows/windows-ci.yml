name: Windows CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked release dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile all Python modules
        run: python -m compileall -q main.py app tests
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Windows distribution
        run: pyinstaller --noconfirm --clean playlist_canvas.spec
      - name: Verify release contents
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Playlist Canvas/Playlist Canvas.exe")) { exit 1 }
          if (Test-Path "dist/Playlist Canvas/ffmpeg") { exit 1 }
          if (-not (Test-Path "dist/Playlist Canvas/_internal/app/resources/app_icon.ico")) { exit 1 }
          if (-not (Test-Path "dist/Playlist Canvas/_internal/python312.dll")) { exit 1 }
      - name: Smoke-test packaged executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: '& "dist/Playlist Canvas/Playlist Canvas.exe" --smoke-test'
